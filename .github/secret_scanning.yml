# The leak gate's positive-control fixture is FAKE credentials by design: it exists so the
# scanner can be proven to fire, and a gate nobody proves is a gate nobody should trust.
# GitHub's own secret scanning cannot tell a proof-sample from a live key, so without this it
# raises an alert per sample - on this repo and on every fork that inherits the file.
#
# Excluded BY NAME rather than by directory: anything else that ever lands under tests/ stays
# scanned, including tests/leak-fixture/clean.md, whose whole job is to stay clean.
#
# This does not make the fixture portable - it is a GitHub-side arrangement, and other hosts
# and local scanners have their own rules. The two shapes a host blocks outright at push time
# are therefore still composed by the self-test rather than committed; see the fixture header.
paths-ignore:
  - "tests/leak-fixture/dirty.md"
