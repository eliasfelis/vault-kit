# vault-audit - opinionated starter rules pack.
# De-identified, proven defaults from a real working vault. Use as-is, or copy to
# `rules.yaml` and adjust. (For a bare minimal schema instead, see rules.example.yaml.)

vault:
  root: "."
  timezone_offset_hours: 0

governance_paths:             # never modified; skipped by all checks
  - "CLAUDE.md"
  - "docs/"
  - "rules/"
  - "templates/"

broken_refs:
  enabled: true
  check_markdown_links: true
  check_frontmatter_field: ""       # e.g. "spec" — a frontmatter field holding a path to validate; "" to skip

frontmatter:
  enabled: true
  required_fields: ["tags", "date"]
  tag_count: { min: 3, max: 8 }
  # Identity + classification namespaces. Domain extensions (geo/, stage/, role/, ...)
  # are EXAMPLES from one vault - replace this list with your own taxonomy.
  tag_namespaces: ["type", "project", "topic", "status"]
  allowed_values: {}          # add closed enums per namespace to enforce them
  exempt_paths:
    - "archive/"
    - "templates/"

naming:
  enabled: true
  # A dated convention: "<project> <type> <description> - YYYY-MM-DD.md".
  # (A plain hyphen separates the date here, for portability across shells and editors.
  #  An en-dash reads better if your tooling handles it; if you switch, change the
  #  pattern below and this comment together, or they drift apart.)
  pattern: '^.+ - \d{4}-\d{2}-\d{2}\.md$'
  exempt_paths:
    - "archive/"
    - "templates/"
    - "docs/"
  # LIVING WORKING FILES. Exempt by basename, not by folder: these sit among ordinary
  # dated deliverables. A dated name cannot describe them (they are amended, not
  # superseded, so they have no single date), and renaming one breaks every inbound
  # link pointing at it. Extend this list with your own living docs; keep it a
  # declaration, not an accident.
  exempt_basenames: ["STATE.md", "index.md", "README.md", "roadmap.md", "active-scope.md", "parking-lot.md"]

duplicates:
  enabled: true
  # Same list, different reason: a living file recurs once per project by design, so
  # identical basenames across the tree are the convention here rather than a duplicate.
  exempt_basenames: ["STATE.md", "index.md", "README.md", "roadmap.md", "active-scope.md", "parking-lot.md"]

staleness:
  enabled: true
  rules:
    - { glob: "inbox/*.md", max_age_days: 7, frontmatter_field: "date" }
    - { glob: "projects/*/STATE.md", max_age_days: 14, frontmatter_field: "date" }

memory:
  enabled: false
  path: ""
  index_file: "MEMORY.md"

leak_scan:                    # defaults for /vault-audit:leak-scan (optional; flags override)
  extra_patterns: ""          # absolute path to your PRIVATE pattern file - keep it outside any published repo
  tracked_only: true
  exclude: '\.git/'

report:
  dir: ".vault-audit"
