# vault-persona config. Copy to `vault-persona.yaml` and adjust.
# Every path is relative to the directory where the command runs (your project root).
# Nothing here is required: with no config file at all, the defaults below apply.

paths:
  personas: "personas"       # directory holding one markdown file per persona

default: "peer"              # persona name used by `/vault-persona:persona default`.
                             # Set to "" if you would rather have no baseline and
                             # always name a persona explicitly.
